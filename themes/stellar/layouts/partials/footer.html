<footer id="footer">
  <section>
    <h2>{{ .Site.Params.footer.title }}</h2>
    <p>{{ .Site.Params.footer.description }}</p>
    <ul class="actions">
      <li>
        <a href="{{ .Site.Params.footer.link }}" class="button"
          >En savoir plus</a
        >
      </li>
    </ul>
  </section>
  <section>
    <h2>Contact</h2>
    <dl class="alt">
      <dt>Email</dt>
      <dd>
        <a href="mailto:{{ .Site.Params.contact.email }}"
          >{{ .Site.Params.contact.email }}</a
        >
      </dd>
    </dl>
    <ul class="icons">
      {{ range .Site.Params.social }}
      <li>
        <a href="{{ .link }}" class="icon brands {{ .icon }} alt"
          ><span class="label">{{ .name }}</span></a
        >
      </li>
      {{ end }}
    </ul>
  </section>
  <p class="copyright">
    &copy; {{ now.Year }} {{ .Site.Params.company }}. Design:
    <a href="https://html5up.net">HTML5 UP</a>.
  </p>
</footer>
